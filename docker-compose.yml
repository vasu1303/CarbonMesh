name: carbonmesh

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: carbonmesh
      POSTGRES_USER: carbonmesh
      POSTGRES_PASSWORD: ${CARBONMESH_LOCAL_DB_PASSWORD:-carbonmesh-local-only}
    ports:
      - "${CARBONMESH_DB_PORT:-5432}:5432"
    volumes:
      - carbonmesh_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carbonmesh -d carbonmesh"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://carbonmesh:${CARBONMESH_LOCAL_DB_PASSWORD:-carbonmesh-local-only}@db:5432/carbonmesh?sslmode=disable
      DEMO_RESET_TOKEN: ${DEMO_RESET_TOKEN:-carbonmesh-local-reset-token}
      AI_PROVIDER: ${AI_PROVIDER:-auto}
      ELECTRICITY_MAPS_API_TOKEN: ${ELECTRICITY_MAPS_API_TOKEN:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
    ports:
      - "${CARBONMESH_API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2).read()
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

volumes:
  carbonmesh_postgres_data:
