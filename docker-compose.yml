name: carbonmesh

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: carbonmesh
      POSTGRES_USER: carbonmesh
      POSTGRES_PASSWORD: ${CARBONMESH_LOCAL_DB_PASSWORD:-carbonmesh-local-only}
    ports:
      - "127.0.0.1:${CARBONMESH_DB_PORT:-5432}:5432"
    volumes:
      - carbonmesh_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carbonmesh -d carbonmesh"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - ./apps/api/.env
    environment:
      DATABASE_URL: postgresql://carbonmesh:${CARBONMESH_LOCAL_DB_PASSWORD:-carbonmesh-local-only}@db:5432/carbonmesh?sslmode=disable
      SOURCE_STORAGE_DIR: /app/.data/sources
    volumes:
      - carbonmesh_source_documents:/app/.data/sources
    ports:
      - "127.0.0.1:${CARBONMESH_API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2).read()
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

volumes:
  carbonmesh_postgres_data:
  carbonmesh_source_documents:
