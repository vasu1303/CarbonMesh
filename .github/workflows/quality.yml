name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: carbonmesh_test
          POSTGRES_USER: carbonmesh_test
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U carbonmesh_test -d carbonmesh_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CARBONMESH_E2E_DATABASE_URL: postgresql://carbonmesh_test:synthetic-ci-only@127.0.0.1:5432/carbonmesh_test
      CARBONMESH_RUN_API_E2E_TESTS: disposable-database
      CARBONMESH_E2E_REQUIRE_PGVECTOR: "1"
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check app tests
      - name: Bootstrap and verify disposable database
        env:
          DATABASE_URL: ${{ env.CARBONMESH_E2E_DATABASE_URL }}
        run: |
          python -m app.db.bootstrap
          python -m app.db.bootstrap --check
      - name: Test
        run: python -m pytest -q
      - name: Build API image
        working-directory: .
        run: docker build -f apps/api/Dockerfile -t carbonmesh-api:ci .
      - name: Check packaged API and fixtures
        working-directory: .
        run: |
          docker run --rm carbonmesh-api:ci python -c '
          from fastapi.testclient import TestClient
          from app.main import app
          from app.modules.demo.fixtures import _fixture_directory
          assert (_fixture_directory() / "complete-q3-manifest-v1.json").is_file()
          with TestClient(app) as client:
              assert client.get("/api/health").status_code == 200
          '

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build
