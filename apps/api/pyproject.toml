[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "carbonmesh-api"
version = "0.1.0"
description = "CarbonMesh FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30.0,<1",
    "fastapi>=0.115.0,<1",
    "httpx>=0.28.0,<1",
    "itsdangerous>=2.2,<3",
    "langgraph>=1.2.12,<2",
    "opentelemetry-api>=1.30,<2",
    "opentelemetry-sdk>=1.30,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
    "pgvector>=0.3.6,<1",
    "pydantic>=2.10.0,<3",
    "pypdf>=5.0.0,<7",
    "python-dotenv>=1.0.1,<2",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "uvicorn[standard]>=0.34.0,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<10",
    "pytest-asyncio>=0.25.0,<2",
    "ruff>=0.9.0,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100
